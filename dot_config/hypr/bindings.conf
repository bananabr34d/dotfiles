# Application bindings
$terminal = uwsm-app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Unbind Omarchy defaults
unbind = SUPER, K, Show key bindings, exec, omarchy-menu-keybindings # Unbind default Super + k
unbind = SUPER, J, Toggle split, togglesplit, # Unbind togglesplit
unbind = SUPER SHIFT, slash, exec, uwsm app -- 1password
unbind = SUPER SHIFT, M, exec, omarchy-launch-or-focus spotify
unbind = SUPER SHIFT, G, exec, omarchy-launch-or-focus signal  # Unbind old Signal binding
unbind = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
unbind = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
unbind = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
# unbind = , PRINT, Screenshot of region, exec, omarchy-cmd-screenshot #unbind when keyboard doesn't have a dedicated print button
# unbind = SHIFT, PRINT, Screenshot of window, exec, omarchy-cmd-screenshot window #unbind when keyboard doesn't have a dedicated print button
# unbind = CTRL, PRINT, Screenshot of display, exec, omarchy-cmd-screenshot output #unbind when keyboard doesn't have a dedicated print button

# Replace SUPER + J/K 
bindd = SUPER, slash, Show key bindings, exec, omarchy-menu-keybindings # Unbind default Super + k
bindd = SUPER, period, Toggle split, togglesplit, # Unbind togglesplit

# Use SUPER SHIFT, RETURN to open file manager
bindd = SUPER SHIFT, RETURN, File manager, exec, uwsm app -- nautilus --new-window

# Override arrow key navigation with hjkl (vim-style)
# Move focus with SUPER + hjkl
bindd = SUPER, H, Move focus left, movefocus, l
bindd = SUPER, L, Move focus right, movefocus, r
bindd = SUPER, K, Move focus up, movefocus, u
bindd = SUPER, J, Move focus down, movefocus, d

# Swap windows with SUPER + SHIFT + hjkl
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

# Move window into group with SUPER + ALT + hjkl (instead of arrow keys)
bindd = SUPER ALT, H, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, L, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, K, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, J, Move window to group on bottom, moveintogroup, d

# Screenshots with keyboard that doesn't have a print button
bindd = , F12, Screenshot of region, exec, omarchy-cmd-screenshot
bindd = SHIFT, F12, Screenshot of window, exec, omarchy-cmd-screenshot window
bindd = CTRL, F12, Screenshot of display, exec, omarchy-cmd-screenshot output
bindd = ALT, F12, Screenrecording, exec, omarchy-menu screenrecord

# Changing Omarchy default applications
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.proton.me/u/0/inbox"
bindd = SUPER SHIFT, slash, Passwords, exec, /home/joe/.local/bin/launch-or-toggle-proton-pass.sh         # Proton Pass
bindd = SUPER SHIFT, M, Music, exec, /home/joe/.local/bin/launch-or-toggle-spotify.sh                     # Spotify
bindd = SUPER SHIFT, Z, Scratchpad, exec, /home/joe/.local/bin/launch-or-toggle-alacritty.sh              # Scratchpad (Alacritty in your case)
bindd = SUPER SHIFT, G, Signal, exec, /home/joe/.local/bin/launch-or-toggle-signal.sh                     # Signal Desktop
bindd = SUPER SHIFT, H, Hyprlauncher, exec,  hyprlauncher                                                 # Hyprlauncher
